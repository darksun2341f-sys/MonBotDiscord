{% extends 'base.html' %}
{% block content %}
  <h2>Serveurs</h2>
  {% if guilds %}
    <ul>
      {% for gid, guild in guilds.items() %}
        <li><a href="{{ url_for('guild_view', guild_id=gid) }}">Guild {{ gid }}</a> — {{ guild.commands | length }} commandes configurées</li>
      {% endfor %}
    </ul>
  {% else %}
    <p>Aucun réglage présent.</p>
  {% endif %}
{% endblock %}
