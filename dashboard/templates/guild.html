{% extends 'base.html' %}
{% block content %}
  <h2>Guild {{ guild_id }}</h2>
  <form method="post">
    <table>
      <tr><th>Commande</th><th>Activée</th><th>Rôle (id)</th><th>Canal (id)</th></tr>
      {% for cmd, settings in commands.items() %}
        <tr>
          <td>{{ cmd }}</td>
          <td><input type="checkbox" name="enabled_{{cmd}}" {% if settings.enabled %}checked{% endif %}></td>
          <td><input type="text" name="role_{{cmd}}" value="{{ settings.required_role or '' }}"></td>
          <td><input type="text" name="channel_{{cmd}}" value="{{ settings.required_channel or '' }}"></td>
        </tr>
      {% endfor %}
    </table>
    <p>
      <button type="submit">Sauvegarder</button>
    </p>
  </form>

  <h3>Ajouter une commande manuellement</h3>
  <form method="post">
    <input type="hidden" name="enabled_newcmd">
    <label>Nom de la commande (ex: ping)</label>
    <input type="text" name="new_command_name">
    <label>Rôle id (optionnel)</label>
    <input type="text" name="new_role">
    <label>Canal id (optionnel)</label>
    <input type="text" name="new_channel">
    <p><button type="submit">Ajouter</button></p>
  </form>
{% endblock %}
