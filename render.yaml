services:
  - name: monbotdiscord-dashboard
    type: web
    env: python
    runtime: python-3.13
    buildCommand: python -m pip install --no-cache-dir -r requirements.txt
    startCommand: python -m uvicorn web.app:app --host 0.0.0.0 --port $PORT

  - name: monbotdiscord-bot
    type: worker
    env: python
    runtime: python-3.13
    buildCommand: python -m pip install --no-cache-dir -r requirements.txt
    startCommand: python main.py
